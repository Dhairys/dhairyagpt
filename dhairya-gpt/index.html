<!DOCTYPE html>
<html lang="en" data-t="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dhairya GPT</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#18181A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#17171a;--side:#121214;--panel:#212126;--hover:#26262c;--line:#2c2c33;--text:#ececf1;--muted:#8e8e99;--accent:#5eead4;--ink:#04201c;--user:#2a2a31;--code:#0e0e10;--w:760px}
html[data-t="light"]{--bg:#fff;--side:#f6f6f8;--panel:#f1f1f4;--hover:#e8e8ec;--line:#e2e2e7;--text:#1a1a1f;--muted:#6e6e78;--accent:#0f766e;--ink:#fff;--user:#eeeef2;--code:#f1f1f4}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--text);font:15px/1.65 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sidebar{width:272px;background:var(--side);display:flex;flex-direction:column;padding:10px;gap:6px;transition:margin .25s ease,transform .25s ease;flex:none}
body.sidebar-collapsed .sidebar{margin-left:-272px}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.brand img{width:28px;height:28px;border-radius:8px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.row-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;width:100%;text-align:left;color:var(--text)}
.row-btn:hover{background:var(--hover)}
a.row-btn{text-decoration:none}
#newChatBtn{border:1px solid var(--line);font-weight:500}
.label{padding:12px 10px 4px;color:var(--muted);font-size:12px}
#chatList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
.chat-item{display:flex;align-items:center;border-radius:10px;position:relative}
.chat-item:hover,.chat-item.active{background:var(--hover)}
.chat-open{flex:1;display:flex;align-items:center;padding:9px 10px;text-align:left;min-width:0}
.chat-icon{display:none}
.chat-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.chat-delete{opacity:0;width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:18px;line-height:1;margin-right:4px}
.chat-item:hover .chat-delete,.chat-item.active .chat-delete{opacity:1}
.chat-delete:hover{color:#f87171;background:var(--line)}
.side-foot{border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:2px}
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{display:flex;align-items:center;gap:6px;padding:8px 12px;min-height:52px}
.topbar .title{font-weight:600;color:var(--muted)}
#menuBtn{display:none}
body.sidebar-collapsed #menuBtn{display:grid}
#messages{flex:1;overflow-y:auto;padding:8px 16px 24px;scroll-behavior:smooth}
.welcome{max-width:var(--w);margin:0 auto;padding-top:min(18vh,140px);text-align:center}
.welcome-logo img{width:64px;height:64px;border-radius:18px}
.welcome h1{margin:20px 0 6px;font-size:30px;font-weight:600;letter-spacing:-.02em}
.welcome p{color:var(--muted);margin:0 0 28px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:left}
.chip{border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--text);line-height:1.4}
.chip:hover{background:var(--hover)}
.chip small{display:block;color:var(--muted);margin-top:2px}
.message-row{max-width:var(--w);margin:0 auto 22px;display:flex;gap:12px;align-items:flex-start}
.user-row{justify-content:flex-end}
.avatar{width:28px;height:28px;border-radius:8px;flex:none;margin-top:2px}
.message{min-width:0;overflow-wrap:anywhere}
.user-message{background:var(--user);padding:10px 16px;border-radius:20px;max-width:82%;white-space:pre-wrap}
.assistant-message{flex:1}
.message h1,.message h2,.message h3{margin:1em 0 .3em;line-height:1.3}
.message h1{font-size:1.4em}.message h2{font-size:1.2em}.message h3{font-size:1.05em}
.message li{margin-left:1.3em;list-style:disc}
.message code{background:var(--code);padding:2px 6px;border-radius:6px;font:.88em ui-monospace,Menlo,Consolas,monospace}
.message pre{background:var(--code);border:1px solid var(--line);padding:14px;border-radius:12px;overflow-x:auto;margin:.8em 0;white-space:pre}
.message pre code{padding:0;background:none}
.message-actions{display:flex;gap:2px;margin-top:6px}
.message-actions button{font-size:12.5px;color:var(--muted);padding:4px 10px;border-radius:8px}
.message-actions button:hover{background:var(--hover);color:var(--text)}
.attach-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.attach-btn:hover{background:var(--hover);color:var(--text)}
.file-tray{max-width:var(--w);margin:0 auto;display:flex;flex-wrap:wrap;gap:8px}
.file-tray:not(:empty){margin-bottom:8px}
.file-chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 10px;max-width:260px;font-size:13.5px}
.file-chip svg{width:16px;height:16px;color:var(--muted)}
.file-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-chip button{width:22px;height:22px;border-radius:50%;color:var(--muted);line-height:1}
.file-chip button:hover{background:var(--hover);color:var(--text)}
.msg-files{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.msg-file{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px 10px;font-size:13px}
.sp{display:block;height:.75em}
.typing{display:inline-flex;gap:5px;padding:10px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.typing + .message-actions{display:none}
@keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.composer-wrap{padding:0 16px calc(12px + env(safe-area-inset-bottom,0px))}
.composer{max-width:var(--w);margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:26px;display:flex;align-items:flex-end;gap:6px;padding:8px 8px 8px 8px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.composer:focus-within{border-color:var(--muted)}
#messageInput{flex:1;resize:none;max-height:180px;padding:9px 0;border:0;background:none;color:var(--text);font:inherit;outline:none}
#messageInput::placeholder{color:var(--muted)}
#sendBtn{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center;flex:none}
#sendBtn:hover{opacity:.88}
.disclaimer{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px;z-index:30}
.modal.show{display:flex}
.modal-box{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:500px}
.modal-box h2{margin:0 0 4px;font-size:18px}
.modal-box p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.modal-box textarea{width:100%;min-height:150px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;resize:vertical;outline:none}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.pill{padding:9px 18px;border-radius:999px;border:1px solid var(--line)}
.pill.primary{background:var(--accent);color:var(--ink);border-color:transparent;font-weight:600}
.backdrop{display:none}
@media(max-width:760px){
 .sidebar{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);margin-left:0!important;width:285px}
 body.sidebar-open .sidebar{transform:none}
 body.sidebar-open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}
 #menuBtn{display:grid!important}
 .chips{grid-template-columns:1fr}
 .welcome h1{font-size:25px}
}
</style>
</head>
<body>
<div class="backdrop" data-toggle-sidebar></div>

<aside class="sidebar">
  <div class="side-top">
    <div class="brand"><img src="/logo.svg" alt=""><span>Dhairya GPT</span></div>
    <button class="icon-btn" data-toggle-sidebar title="Close sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
  </div>
  <button id="newChatBtn" class="row-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
  <div class="label">Recent</div>
  <div id="chatList"></div>
  <div class="side-foot">
    <button id="instructionsBtn" class="row-btn"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Custom instructions</button>
    <button id="themeBtn" class="row-btn"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Light / dark</button>
    <button id="clearChatsBtn" class="row-btn"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>Delete all chats</button>
    <a href="/terms.html" class="row-btn" target="_blank"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"/></svg>Terms &amp; Conditions</a>
  </div>
</aside>

<main>
  <div class="topbar">
    <button id="menuBtn" class="icon-btn" data-toggle-sidebar title="Open sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    <span class="title">Dhairya GPT</span>
  </div>
  <div id="messages"></div>
  <div class="composer-wrap">
    <div id="fileTray" class="file-tray"></div>
    <div class="composer">
      <button id="attachBtn" class="attach-btn" title="Attach a file"><svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg></button>
      <input id="fileInput" type="file" multiple hidden accept=".txt,.md,.csv,.tsv,.json,.js,.jsx,.ts,.tsx,.py,.java,.c,.cpp,.h,.cs,.go,.rs,.php,.rb,.sh,.html,.css,.xml,.yml,.yaml,.sql,.log,.ini,.toml,.pdf,.docx">
      <textarea id="messageInput" rows="1" placeholder="Message Dhairya GPT" autofocus></textarea>
      <button id="sendBtn" title="Send"></button>
    </div>
    <div class="disclaimer">Dhairya GPT can make mistakes. Check important info. <a href="/terms.html" target="_blank" style="color:inherit">Terms</a></div>
  </div>
</main>

<div id="instructionsModal" class="modal">
  <div class="modal-box">
    <h2>Custom instructions</h2>
    <p>Tell Dhairya GPT how you'd like it to respond.</p>
    <textarea id="instructionsInput" placeholder="e.g. Keep answers short and use simple words."></textarea>
    <div class="modal-actions">
      <button class="pill" data-close-modal>Cancel</button>
      <button id="saveInstructionsBtn" class="pill primary">Save</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}</script>
</body>
</html>
