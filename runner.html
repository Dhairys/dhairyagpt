<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Lane Runner</title>
<style>
html,body{margin:0;height:100%;background:#17171a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Lane Runner: a small original endless runner. Dodge the trains, grab the coins.
(function () {
  var c = document.getElementById("c"), x = c.getContext("2d"), W, H;
  function fit() {
    var d = window.devicePixelRatio || 1;
    W = c.clientWidth; H = c.clientHeight;
    c.width = W * d; c.height = H * d;
    x.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener("resize", fit); fit();

  var best = 0;
  try { best = +localStorage.getItem("runner_best") || 0; } catch (e) {}
  var lane, px, obs, coins, speed, score, got, over, spawn, off, started = false;

  function reset() { lane = 1; px = 1; obs = []; coins = []; speed = 260; score = 0; got = 0; over = false; spawn = 80; off = 0; }
  reset();

  function move(d) { if (!over) { started = true; lane = Math.max(0, Math.min(2, lane + d)); } }
  addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowLeft" || k === "a") move(-1);
    else if (k === "ArrowRight" || k === "d") move(1);
    else if ((k === " " || k === "Enter") && over) reset();
    if (k.indexOf("Arrow") === 0 || k === " ") e.preventDefault();
  });
  var sx = null;
  c.addEventListener("pointerdown", function (e) { window.focus(); if (over) { reset(); return; } sx = e.clientX; });
  c.addEventListener("pointerup", function (e) {
    if (sx === null) return;
    var dx = e.clientX - sx;
    move(Math.abs(dx) > 25 ? (dx > 0 ? 1 : -1) : (e.clientX < W / 2 ? -1 : 1));
    sx = null;
  });

  function lw() { return Math.min(W / 3, 96); }
  function lx(l) { return W / 2 + (l - 1) * lw(); }

  function update(dt) {
    if (over) return;
    speed += dt * 6; off = (off + speed * dt) % 60; score += speed * dt / 20;
    px += (lane - px) * Math.min(1, dt * 14);
    spawn -= speed * dt;
    if (spawn <= 0) {
      spawn = 240 + Math.random() * 160;
      var l = Math.floor(Math.random() * 3);
      if (Math.random() < 0.65) obs.push({ l: l, y: -140, h: 100 });
      else for (var i = 0; i < 5; i++) coins.push({ l: l, y: -40 - i * 46 });
    }
    var py = H * 0.78;
    obs.forEach(function (o) { o.y += speed * dt; });
    coins.forEach(function (k) { k.y += speed * dt; });
    for (var i = 0; i < obs.length; i++) {
      var o = obs[i];
      if (Math.abs(o.l - px) < 0.6 && o.y + o.h > py - 26 && o.y < py + 26) {
        over = true;
        if (score > best) { best = Math.floor(score); try { localStorage.setItem("runner_best", best); } catch (e) {} }
      }
    }
    coins = coins.filter(function (k) {
      if (Math.abs(k.l - px) < 0.6 && Math.abs(k.y - py) < 30) { got++; score += 10; return false; }
      return k.y < H + 40;
    });
    obs = obs.filter(function (o) { return o.y < H + 140; });
  }

  function draw() {
    var w = lw(), py = H * 0.78;
    x.fillStyle = "#17171a"; x.fillRect(0, 0, W, H);
    x.fillStyle = "#202026"; x.fillRect(lx(0) - w / 2, 0, w * 3, H);
    x.fillStyle = "#34343c";
    for (var i = 0; i <= 3; i++) for (var y = -60 + off; y < H; y += 60) x.fillRect(lx(0) - w / 2 + i * w - 1, y, 2, 30);
    obs.forEach(function (o) {
      x.fillStyle = "#ef6a5b"; x.fillRect(lx(o.l) - w * 0.4, o.y, w * 0.8, o.h);
      x.fillStyle = "#ffd1c9"; x.fillRect(lx(o.l) - w * 0.3, o.y + 14, w * 0.6, 16);
      x.fillStyle = "#b8473b"; x.fillRect(lx(o.l) - w * 0.4, o.y + o.h - 10, w * 0.8, 10);
    });
    coins.forEach(function (k) {
      x.fillStyle = "#fbbf24"; x.beginPath(); x.arc(lx(k.l), k.y, 9, 0, 7); x.fill();
      x.fillStyle = "#f59e0b"; x.beginPath(); x.arc(lx(k.l), k.y, 4, 0, 7); x.fill();
    });
    var X = lx(px);
    x.fillStyle = "#5eead4"; x.fillRect(X - 14, py - 8, 28, 34);
    x.beginPath(); x.arc(X, py - 18, 12, 0, 7); x.fill();
    x.fillStyle = "#04201c"; x.fillRect(X - 6, py - 22, 4, 4); x.fillRect(X + 2, py - 22, 4, 4);
    x.fillStyle = "#ececf1"; x.font = "600 14px system-ui,sans-serif"; x.textAlign = "left";
    x.fillText("Score " + Math.floor(score), 12, 22);
    x.fillText("Coins " + got, 12, 42);
    x.fillStyle = "#8e8e99"; x.fillText("Best " + Math.max(best, 0), 12, 62);
    if (!started && !over) {
      x.textAlign = "center"; x.fillStyle = "#ececf1";
      x.fillText("Arrow keys, or swipe / tap sides", W / 2, H * 0.45);
    }
    if (over) {
      x.fillStyle = "rgba(0,0,0,.6)"; x.fillRect(0, 0, W, H);
      x.textAlign = "center"; x.fillStyle = "#fff"; x.font = "700 24px system-ui,sans-serif";
      x.fillText("Game over", W / 2, H / 2 - 8);
      x.font = "500 14px system-ui,sans-serif"; x.fillText("Tap or press Space to play again", W / 2, H / 2 + 20);
    }
  }

  var last = performance.now();
  (function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
