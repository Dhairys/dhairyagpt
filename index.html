<!DOCTYPE html>
<html lang="en" data-t="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhairya GPT</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
:root{--bg:#18181A;--panel:#1f1f22;--line:#2e2e33;--text:#ececef;--muted:#9a9aa3;--accent:#5eead4;--accent-ink:#06231f;--user:#2a2a2f;--code:#101012}
html[data-t="light"]{--bg:#f7f7f8;--panel:#ececef;--line:#d9d9de;--text:#18181A;--muted:#6b6b75;--accent:#0f766e;--accent-ink:#fff;--user:#e4e4e8;--code:#e2e2e6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
aside{width:260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;padding:4px}
.brand img{width:30px;height:30px;border-radius:8px}
.btn{padding:9px 12px;border-radius:10px;border:1px solid var(--line);text-align:left}
.btn:hover{background:var(--user)}
#newChatBtn{background:var(--accent);color:var(--accent-ink);border:0;font-weight:600}
#newChatBtn:hover{background:var(--accent);opacity:.9}
#chatList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.chat-item{display:flex;align-items:center;border-radius:8px}
.chat-item:hover,.chat-item.active{background:var(--user)}
.chat-open{flex:1;display:flex;gap:8px;align-items:center;padding:8px;text-align:left;min-width:0}
.chat-icon{font-size:8px;color:var(--muted)}
.chat-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-delete{padding:4px 10px;color:var(--muted);font-size:18px}
.chat-delete:hover{color:#f87171}
.side-actions{display:flex;flex-direction:column;gap:6px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#messages{flex:1;overflow-y:auto;padding:24px 16px}
.welcome{max-width:480px;margin:12vh auto 0;text-align:center}
.welcome-logo img{width:72px;height:72px;border-radius:18px}
.welcome h1{margin:16px 0 4px;font-size:26px}
.welcome p{color:var(--muted);margin:0}
.message-row{max-width:760px;margin:0 auto 16px;display:flex}
.user-row{justify-content:flex-end}
.message{padding:10px 14px;border-radius:14px;max-width:100%;overflow-wrap:anywhere}
.user-message{background:var(--user);max-width:85%}
.assistant-message{padding-left:0}
.message h1,.message h2,.message h3{margin:.6em 0 .2em;line-height:1.3}
.message h1{font-size:1.4em}.message h2{font-size:1.2em}.message h3{font-size:1.05em}
.message code{background:var(--code);padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
.message pre{background:var(--code);padding:12px;border-radius:10px;overflow-x:auto}
.message pre code{padding:0;background:none}
.message-actions{display:flex;gap:6px;margin-top:6px}
.message-actions button{font-size:12px;color:var(--muted);padding:3px 9px;border:1px solid var(--line);border-radius:7px}
.message-actions button:hover{color:var(--text)}
.composer{max-width:760px;width:100%;margin:0 auto;padding:8px 16px 18px;display:flex;gap:8px;align-items:flex-end}
#messageInput{flex:1;resize:none;max-height:150px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;outline:none}
#messageInput:focus{border-color:var(--accent)}
#sendBtn{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:12px 18px;border-radius:14px}
#sendBtn:disabled{opacity:.5;cursor:not-allowed}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.show{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:480px}
.modal-box h2{margin:0 0 4px}
.modal-box p{margin:0 0 12px;color:var(--muted);font-size:13px}
.modal-box textarea{width:100%;min-height:140px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.modal-actions .primary{background:var(--accent);color:var(--accent-ink);border:0;font-weight:600}
@media(max-width:720px){aside{display:none}}
</style>
</head>
<body>
<aside>
  <div class="brand"><img src="/logo.svg" alt=""><span>Dhairya GPT</span></div>
  <button id="newChatBtn" class="btn">+ New chat</button>
  <div id="chatList"></div>
  <div class="side-actions">
    <button id="instructionsBtn" class="btn">Custom instructions</button>
    <button id="themeBtn" class="btn">Toggle theme</button>
    <button id="clearChatsBtn" class="btn">Delete all chats</button>
  </div>
</aside>

<main>
  <div id="messages"></div>
  <div class="composer">
    <textarea id="messageInput" rows="1" placeholder="Message Dhairya GPT…"></textarea>
    <button id="sendBtn">Send</button>
  </div>
</main>

<div id="instructionsModal" class="modal">
  <div class="modal-box">
    <h2>Custom instructions</h2>
    <p>Tell Dhairya GPT how you'd like it to respond.</p>
    <textarea id="instructionsInput" placeholder="e.g. Keep answers short and use simple words."></textarea>
    <div class="modal-actions">
      <button class="btn" data-close-modal>Cancel</button>
      <button id="saveInstructionsBtn" class="btn primary">Save</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
