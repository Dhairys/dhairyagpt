<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"
  >

  <meta name="theme-color" content="#212121">

  <title>Dhairya GPT</title>

  <link rel="icon" type="image/svg+xml" href="/logo.svg">

  <script>
    document.documentElement.dataset.t =
      localStorage.getItem("oac.theme") || "dark";
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #212121;
      --sidebar: #171717;
      --panel: #2f2f2f;
      --panel2: #303030;
      --text: #ffffff;
      --muted: #a9a9a9;
      --border: #3f3f3f;
      --accent: #ffffff;
      --user: #303030;
    }

    html[data-t="light"] {
      --bg: #ffffff;
      --sidebar: #f7f7f7;
      --panel: #f1f1f1;
      --panel2: #eeeeee;
      --text: #171717;
      --muted: #666666;
      --border: #dddddd;
      --accent: #171717;
      --user: #eeeeee;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* SIDEBAR */

    .sidebar {
      width: 270px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 14px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 4px 16px;
    }

    .app-logo {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: block;
    }

    .brand-text {
      font-weight: 700;
      font-size: 17px;
    }

    .new-chat {
      width: 100%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 11px 14px;
      border-radius: 10px;
      text-align: left;
      margin-bottom: 12px;
    }

    .new-chat:hover {
      background: var(--panel);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      align-items: center;
      margin-bottom: 3px;
      border-radius: 8px;
    }

    .chat-item.active {
      background: var(--panel);
    }

    .chat-open {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 10px;
      text-align: left;
      min-width: 0;
    }

    .chat-title {
      display: inline-block;
      max-width: 170px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      vertical-align: middle;
    }

    .chat-icon {
      margin-right: 8px;
      font-size: 9px;
      opacity: .6;
    }

    .chat-delete {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      padding: 8px;
    }

    .chat-delete:hover {
      color: var(--text);
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 10px;
    }

    .sidebar-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 10px;
      border-radius: 8px;
    }

    .sidebar-button:hover {
      background: var(--panel);
    }

    /* MAIN */

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .top-title {
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      gap: 6px;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      color: var(--text);
      border-radius: 8px;
    }

    .icon-button:hover {
      background: var(--panel);
    }

    /* MESSAGES */

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 18px 150px;
    }

    .message-row {
      display: flex;
      width: 100%;
      max-width: 850px;
      margin: 0 auto 22px;
    }

    .user-row {
      justify-content: flex-end;
    }

    .assistant-row {
      justify-content: flex-start;
    }

    .message {
      max-width: 78%;
      line-height: 1.65;
      font-size: 15px;
      word-wrap: break-word;
    }

    .user-message {
      background: var(--user);
      padding: 11px 15px;
      border-radius: 18px;
    }

    .assistant-message {
      max-width: 850px;
      width: 100%;
    }

    .message pre {
      background: #111111;
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
    }

    .message code {
      background: rgba(127,127,127,.18);
      padding: 2px 5px;
      border-radius: 5px;
    }

    .message pre code {
      background: transparent;
      padding: 0;
    }

    .message h1,
    .message h2,
    .message h3 {
      margin-top: 18px;
    }

    .message-actions {
      display: flex;
      gap: 5px;
      margin-top: 9px;
      opacity: .7;
    }

    .message-actions button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      padding: 3px 5px;
    }

    .message-actions button:hover {
      color: var(--text);
    }

    /* WELCOME */

    .welcome {
      min-height: 55vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: var(--text);
    }

    .welcome-logo {
      width: 62px;
      height: 62px;
      border-radius: 17px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .welcome-logo img {
      width: 100%;
      height: 100%;
    }

    .welcome h1 {
      font-size: 28px;
      margin: 0 0 8px;
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
    }

    /* COMPOSER */

    .composer-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 15px 18px 18px;
      background: linear-gradient(
        transparent,
        var(--bg) 25%
      );
    }

    .composer {
      max-width: 850px;
      margin: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex;
      align-items: flex-end;
      padding: 9px;
    }

    .composer textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 9px 10px;
      min-height: 42px;
      max-height: 150px;
    }

    .composer textarea::placeholder {
      color: var(--muted);
    }

    .send-button {
      border: 0;
      background: var(--accent);
      color: var(--bg);
      border-radius: 11px;
      padding: 9px 14px;
      font-weight: 600;
    }

    .send-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .footer-note {
      max-width: 850px;
      margin: 7px auto 0;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }

    /* MODALS */

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.65);
      z-index: 100;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(550px, 100%);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .modal-box textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 15px;
    }

    .modal-actions button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 9px;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .messages {
        padding-left: 12px;
        padding-right: 12px;
      }

      .message {
        max-width: 90%;
      }

      .composer-wrap {
        padding-left: 10px;
        padding-right: 10px;
      }

      .welcome h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="brand">
      <img
        src="/logo.svg"
        alt="Dhairya GPT"
        class="app-logo"
      >

      <div class="brand-text">
        Dhairya GPT
      </div>
    </div>

    <button
      id="newChatBtn"
      class="new-chat"
    >
      + New chat
    </button>

    <div
      id="chatList"
      class="chat-list"
    ></div>

    <div class="sidebar-bottom">

      <button
        id="instructionsBtn"
        class="sidebar-button"
      >
        Custom instructions
      </button>

      <button
        id="themeBtn"
        class="sidebar-button"
      >
        Toggle theme
      </button>

      <button
        id="clearChatsBtn"
        class="sidebar-button"
      >
        Clear chats
      </button>

    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <div class="top-title">
        Dhairya GPT
      </div>

      <div class="top-actions">
        <button
          id="themeTopBtn"
          class="icon-button"
          title="Toggle theme"
          onclick="toggleTheme()"
        >
          ◐
        </button>
      </div>

    </header>

    <div
      id="messages"
      class="messages"
    ></div>

    <div class="composer-wrap">

      <div class="composer">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message Dhairya GPT..."
        ></textarea>

        <button
          id="sendBtn"
          class="send-button"
        >
          Send
        </button>

      </div>

      <div class="footer-note">
        Dhairya GPT can make mistakes. Check important information.
      </div>

    </div>

  </main>

</div>

<!-- CUSTOM INSTRUCTIONS -->

<div
  id="instructionsModal"
  class="modal"
>

  <div class="modal-box">

    <h2>Custom instructions</h2>

    <p>
      Tell Dhairya GPT how you want it to respond.
    </p>

    <textarea
      id="instructionsInput"
      placeholder="Example: Keep answers concise and explain difficult topics simply."
    ></textarea>

    <div class="modal-actions">

      <button
        data-close-modal
      >
        Cancel
      </button>

      <button
        id="saveInstructionsBtn"
      >
        Save
      </button>

    </div>

  </div>

</div>

<script src="/app.js"></script>

</body>
</html>
